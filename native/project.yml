name: ReadTheCode
options:
  deploymentTarget:
    macOS: '14.0'
  createIntermediateGroups: true
  defaultConfig: Debug
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: '6.0'
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Manual
    SWIFT_STRICT_CONCURRENCY: complete
  configs:
    Release:
      ENABLE_HARDENED_RUNTIME: YES
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.6.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    exactVersion: 2.6.0
targets:
  ReadTheCode:
    type: application
    platform: macOS
    sources:
      - App/ReadTheCodeApp
    dependencies:
      - target: RTCAgentChat
      - target: RTCContracts
      - target: RTCIPC
      - target: RTCDomain
      - target: RTCDiffCanvas
      - target: RTCGit
      - target: RTCStore
      - target: RTCReview
      - target: RTCReviewWorkspace
      - target: RTCDesign
      - target: RTCExport
      - target: RTCInboxFeature
      - target: RTCIngest
      - target: RTCLifecycle
      - target: RTCSettings
      - target: RTCTourIntegration
      - target: RTCWorkspaceShell
      - target: TourWorkspace
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.readthecode.app
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: App/Resources/Info.plist
    entitlements:
      path: App/ReadTheCodeApp.entitlements
  rtc:
    type: tool
    platform: macOS
    sources:
      - path: CLI/rtc/main.swift
    dependencies:
      - target: RTCCLI
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.readthecode.rtc
    entitlements:
      path: CLI/rtc.entitlements
  GitWorker:
    type: framework
    platform: macOS
    sources:
      - Services/GitWorker
    dependencies:
      - target: RTCContracts
      - target: RTCGit
  ModelWorker:
    type: framework
    platform: macOS
    sources:
      - Services/ModelWorker
    dependencies:
      - target: RTCContracts
      - target: RTCModelAdapters

  RTCContracts:
    type: framework
    platform: macOS
    sources:
      - Sources/RTCContracts
  RTCDomain:
    type: framework
    platform: macOS
    sources:
      - Sources/RTCDomain
    dependencies:
      - target: RTCContracts
  RTCStore:
    type: framework
    platform: macOS
    sources:
      - Sources/RTCStore
    dependencies:
      - target: RTCContracts
      - package: GRDB
  RTCIPC:
    type: framework
    platform: macOS
    sources:
      - Sources/RTCIPC
    dependencies:
      - target: RTCContracts
  RTCGit:
    type: framework
    platform: macOS
    sources:
      - Sources/RTCGit
    dependencies:
      - target: RTCContracts
  RTCSyntax:
    type: framework
    platform: macOS
    sources:
      - Sources/RTCSyntax
    dependencies:
      - target: RTCContracts
  RTCDiffCanvas:
    type: framework
    platform: macOS
    sources:
      - Sources/RTCDiffCanvas
    dependencies:
      - target: RTCContracts
  RTCDiagram:
    type: framework
    platform: macOS
    sources:
      - Sources/RTCDiagram
    dependencies:
      - target: RTCContracts
  RTCTour:
    type: framework
    platform: macOS
    sources:
      - Sources/RTCTour
    dependencies:
      - target: RTCContracts
      - target: RTCDiagram
  RTCModelAdapters:
    type: framework
    platform: macOS
    sources:
      - Sources/RTCModelAdapters
    dependencies:
      - target: RTCContracts
  RTCAgentChat:
    type: framework
    platform: macOS
    sources:
      - Sources/RTCAgentChat
    dependencies:
      - target: RTCContracts
      - target: RTCIPC
  RTCReview:
    type: framework
    platform: macOS
    sources:
      - Sources/RTCReview
    dependencies:
      - target: RTCContracts
      - target: RTCDomain
  RTCDesign:
    type: framework
    platform: macOS
    sources:
      - Sources/RTCDesign
  RTCLifecycle:
    type: framework
    platform: macOS
    sources:
      - Sources/RTCLifecycle
    dependencies:
      - target: RTCContracts
  RTCSettings:
    type: framework
    platform: macOS
    sources:
      - Sources/RTCSettings
    dependencies:
      - target: RTCContracts
      - target: RTCModelAdapters
      - target: RTCLifecycle
  RTCExport:
    type: framework
    platform: macOS
    sources:
      - Sources/RTCExport
    dependencies:
      - target: RTCContracts
      - target: RTCDiagram
      - target: RTCIPC
      - target: RTCReview
      - target: RTCTour
  RTCIngest:
    type: framework
    platform: macOS
    sources:
      - Sources/RTCIngest
    dependencies:
      - target: RTCContracts
      - target: RTCGit
      - target: RTCIPC
      - target: RTCLifecycle
      - target: RTCStore
      - package: GRDB
  RTCInboxFeature:
    type: framework
    platform: macOS
    sources:
      - Features/Inbox
    dependencies:
      - target: RTCContracts
      - target: RTCDesign
      - target: RTCIngest
  RTCWorkspaceShell:
    type: framework
    platform: macOS
    sources:
      - Sources/RTCWorkspaceShell
    dependencies:
      - target: RTCDesign
      - target: RTCContracts
      - target: RTCAgentChat
  RTCReviewWorkspace:
    type: framework
    platform: macOS
    sources:
      - Sources/RTCReviewWorkspace
    dependencies:
      - target: RTCContracts
      - target: RTCDomain
      - target: RTCReview
      - target: RTCSyntax
      - target: RTCDiffCanvas
      - target: RTCDesign
      - target: RTCWorkspaceShell
  RTCTourIntegration:
    type: framework
    platform: macOS
    sources:
      - Sources/RTCTourIntegration
    dependencies:
      - target: RTCContracts
      - target: RTCDiagram
      - target: RTCGit
      - target: RTCModelAdapters
      - target: RTCStore
      - target: RTCSyntax
      - target: RTCTour
      - package: GRDB
  TourWorkspace:
    type: framework
    platform: macOS
    sources:
      - Features/TourWorkspace
    dependencies:
      - target: RTCContracts
      - target: RTCDesign
      - target: RTCDiagram
      - target: RTCTourIntegration
  RTCAgentChatIntegration:
    type: framework
    platform: macOS
    sources: []
    dependencies:
      - target: RTCContracts
      - target: RTCAgentChat
  RTCCLI:
    type: framework
    platform: macOS
    sources:
      - path: CLI/rtc/RTCCLI.swift
    dependencies:
      - target: RTCContracts
      - target: RTCGit
      - target: RTCIngest
      - target: RTCIPC
  RTCTestSupport:
